[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kayframework"
version = "0.2.1"
description = "A scaffold-first FastAPI micro-framework with a module-oriented CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kayjs" }]
keywords = ["fastapi", "framework", "cli", "scaffold", "microframework"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "fastapi-utils>=0.8",
  "sqlalchemy>=2.0",
  "passlib[bcrypt]>=1.7",
  "bcrypt==4.0.1",
  "python-jose[cryptography]>=3.3",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "pydantic[email]>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.0",
  "build>=1.2",
  "twine>=5.0",
]
postgres = [
  "psycopg2-binary>=2.9",
]

[project.scripts]
kay = "kayframework.cli:main"

[project.urls]
Homepage = "https://github.com/kayjs/kayframework"
Package = "https://pypi.org/project/kayframework/"
Documentation = "https://github.com/kayjs/kayframework/tree/main/docs"
Repository = "https://github.com/kayjs/kayframework"
Issues = "https://github.com/kayjs/kayframework/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kayframework", "kayframework.*"]

[tool.setuptools.package-data]
"kayframework" = [
  "project_template/**/*",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
